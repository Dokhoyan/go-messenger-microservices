version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - GATEWAY_HOST=${GATEWAY_HOST:-0.0.0.0}
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:50051}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-http://chat-service:50052}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:50053}
    depends_on:
      - auth-service
      - chat-service
      - user-service
    networks:
      - messenger-network

