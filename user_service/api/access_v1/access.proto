syntax = "proto3";

package access_v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/Dokhoyan/go-messenger-microservices/user_service/pkg/api/access_v1;access_v1";


service AccessV1 {
  rpc Check(CheckRequest) returns (google.protobuf.Empty);
}

message CheckRequest {
    string endpoint_address = 1;
}